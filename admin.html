<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoneyQuest Kids — Admin Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>

<div class="mq-blob-bg">
  <div class="mq-blob b1"></div>
  <div class="mq-blob b2"></div>
  <div class="mq-blob b3"></div>
</div>

<nav class="navbar navbar-expand mq-navbar mb-4" id="mqNavbar"></nav>

<div class="container pb-5">
  <a href="dashboard.html" class="text-mq-purple fw-semibold text-decoration-none">&larr; Back to Dashboard</a>
  <h2 class="mb-4 mt-3">🛠️ Admin Dashboard</h2>

  <div class="row g-3 mb-4" id="statsGrid">
    <div class="col-12 text-mq-ink-soft">Loading stats...</div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <div class="mq-card mq-card-body">
        <h5>Completion Status</h5>
        <canvas id="completionChart" height="220"></canvas>
      </div>
    </div>
    <div class="col-md-6">
      <div class="mq-card mq-card-body">
        <h5>Module Completion</h5>
        <canvas id="moduleChart" height="220"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/gamification.js"></script>
<script src="assets/js/admin.js"></script>
