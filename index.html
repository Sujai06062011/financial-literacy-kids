<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MoneyQuest Kids — Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>

<div class="mq-blob-bg">
  <div class="mq-blob b1"></div>
  <div class="mq-blob b2"></div>
  <div class="mq-blob b3"></div>
</div>

<div class="container">
  <div class="mq-card mq-auth-card mq-fade-in">
    <div class="mq-card-body">
      <div class="text-center mb-4">
        <div class="mq-emoji-lg">💰</div>
        <h1 class="mb-0">MoneyQuest Kids</h1>
        <p class="text-mq-ink-soft mb-0">Learn • Play • Save • Grow</p>
      </div>

      <div id="loginAlert" class="alert d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">Email</label>
          <input type="email" class="form-control" id="email" required placeholder="you@example.com" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="password">Password</label>
          <input type="password" class="form-control" id="password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-mq btn-mq-primary w-100 mt-2" id="loginBtn">
          Login &amp; Start Learning 🚀
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        New student? <a href="register.html" class="text-mq-purple fw-semibold">Create an account</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script>
  // If already logged in, skip straight to the dashboard.
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "dashboard.html";
  })();

  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    document.getElementById("loginAlert").classList.add("d-none");
    btn.disabled = true;
    btn.textContent = "Logging in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      const alertEl = document.getElementById("loginAlert");
      alertEl.className = "alert alert-danger mq-fade-in";
      alertEl.textContent = error.message;
      alertEl.classList.remove("d-none");
      btn.disabled = false;
      btn.textContent = "Login & Start Learning 🚀";
      return;
    }

    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
