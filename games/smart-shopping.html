<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Shopping — MoneyQuest Kids</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>

<div class="mq-blob-bg">
  <div class="mq-blob b1"></div>
  <div class="mq-blob b2"></div>
  <div class="mq-blob b3"></div>
</div>

<nav class="navbar navbar-expand mq-navbar mb-4" id="mqNavbar"></nav>

<div class="container pb-5" style="max-width: 820px;">
  <a href="../dashboard.html" class="text-mq-purple fw-semibold text-decoration-none">&larr; Back to Dashboard</a>

  <div class="mq-card mq-card-body mt-3 mq-fade-in">
    <div class="text-center mb-3">
      <span class="mq-emoji-lg">🛒</span>
      <h2 class="mb-1">Smart Shopping</h2>
      <p class="text-mq-ink-soft">
        You have a budget of <strong id="budgetLabel"></strong>. Buy everything you
        <em>need</em>, and only add <em>wants</em> if there's money left over!
      </p>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <span class="mq-pill mq-pill-coins">🛍️ Cart: ₹<span id="cartTotal">0</span></span>
      <span class="mq-pill" id="remainingPill">Remaining: ₹0</span>
    </div>

    <div class="row g-3" id="itemsGrid"></div>

    <div class="text-center mt-4">
      <button id="checkoutBtn" class="btn btn-mq btn-mq-primary">Checkout ✅</button>
    </div>

    <div id="resultBox" class="mt-4"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/gamification.js"></script>
<script src="../assets/js/games/smart-shopping.js"></script>
</body>
</html>
