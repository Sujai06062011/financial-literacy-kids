<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Needs vs Wants — MoneyQuest Kids</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="../assets/css/style.css" rel="stylesheet" />
</head>
<body>

<div class="mq-blob-bg">
  <div class="mq-blob b1"></div>
  <div class="mq-blob b2"></div>
  <div class="mq-blob b3"></div>
</div>

<nav class="navbar navbar-expand mq-navbar mb-4" id="mqNavbar"></nav>

<div class="container pb-5" style="max-width: 600px;">
  <a href="../dashboard.html" class="text-mq-purple fw-semibold text-decoration-none">&larr; Back to Dashboard</a>

  <div class="mq-card mq-card-body mt-3 mq-fade-in text-center">
    <span class="mq-emoji-lg">🧩</span>
    <h2 class="mb-1">Needs vs Wants</h2>
    <p class="text-mq-ink-soft">Sort each item as fast as you can!</p>

    <div class="d-flex justify-content-between small text-mq-ink-soft mb-2">
      <span id="progressLabel">Item 1 of 10</span>
      <span id="scoreLabel">Score: 0</span>
    </div>

    <div id="gameArea" class="my-4">
      <div class="mq-emoji-lg" id="itemEmoji">🍞</div>
      <h3 id="itemName">Loading...</h3>
    </div>

    <div class="d-flex gap-3 justify-content-center">
      <button id="needBtn" class="btn btn-mq btn-mq-teal flex-fill">✅ Need</button>
      <button id="wantBtn" class="btn btn-mq btn-mq-outline flex-fill">🎈 Want</button>
    </div>

    <div id="feedback" class="mt-3 fw-semibold"></div>
    <div id="resultBox" class="mt-4"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/gamification.js"></script>
<script src="../assets/js/games/needs-vs-wants.js"></script>
</body>
</html>
